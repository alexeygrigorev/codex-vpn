[project]
name = "codex-vpn"
version = "0.1.0"
description = "Route Codex/OpenAI traffic through a US exit on a GCP free-tier VM via an SSH tunnel and a local proxy"
readme = "README.md"
authors = [
    { name = "Alexey Grigorev", email = "alexey.s.grigoriev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.2.2",
]

[project.scripts]
codex-vpn = "codex_vpn:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
